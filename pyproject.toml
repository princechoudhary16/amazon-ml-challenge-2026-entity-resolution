[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "1.0.0"
description = "Scalable business entity resolution across noisy multi-source records (Amazon ML Challenge 2026)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Prince Choudhary" }]
dependencies = [
    "lightgbm>=4.7",
    "numpy>=2.0",
    "pandas>=3.0",
    "pyarrow>=15",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "sparse-dot-topn>=1.1",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
